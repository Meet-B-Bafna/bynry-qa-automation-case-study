[pytest]
testpaths = tests
addopts =
    -ra
    --strict-markers
    -n auto
    --reruns 1
    --reruns-delay 2
markers =
    ui: web UI tests (Playwright)
    api: API-only tests
    integration: cross-layer API+UI+mobile+security tests
    mobile: mobile tests (BrowserStack/Appium)
    smoke: fast subset for PR gating
env(name): mark test as requiring a specific --env value
